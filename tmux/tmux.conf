# Ghostty sends these dedicated escape sequences for scrollback shortcuts.
set -s user-keys[0] "\e[99;1u"
set -s user-keys[1] "\e[99;2u"
set -s user-keys[2] "\e[99;3u"
set -s user-keys[3] "\e[99;4u"

# Enter copy mode automatically, then scroll tmux's history.
bind-key -n User0 copy-mode -e \; send-keys -X page-up
bind-key -n User1 copy-mode -e \; send-keys -X page-down
bind-key -n User2 copy-mode -e \; send-keys -X halfpage-up
bind-key -n User3 copy-mode -e \; send-keys -X halfpage-down

bind-key -T copy-mode User0 send-keys -X page-up
bind-key -T copy-mode User1 send-keys -X page-down
bind-key -T copy-mode User2 send-keys -X halfpage-up
bind-key -T copy-mode User3 send-keys -X halfpage-down

bind-key -T copy-mode-vi User0 send-keys -X page-up
bind-key -T copy-mode-vi User1 send-keys -X page-down
bind-key -T copy-mode-vi User2 send-keys -X halfpage-up
bind-key -T copy-mode-vi User3 send-keys -X halfpage-down
